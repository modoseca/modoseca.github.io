<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar · Modo Seca</title>
<style>
:root{--bg:#F4F6F4;--card:#fff;--ink:#142019;--muted:#55635A;--line:#DDE3DE;--acc:#2B50E8;--bad:#D23F3A}
@media (prefers-color-scheme:dark){:root{--bg:#0D1310;--card:#151D18;--ink:#EEF2EF;--muted:#A3B0A7;--line:#26302A;--acc:#829BFF;--bad:#FF6B63}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center}
main{width:100%;max-width:440px;margin:0 auto;padding:32px 16px}
.logo{width:64px;height:64px;display:block;margin-bottom:18px}
h1{font-size:28px;line-height:1.15;margin:0 0 8px;letter-spacing:-.4px}
p{margin:0 0 16px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 17px system-ui,sans-serif;text-decoration:none;cursor:pointer;margin-bottom:12px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn[hidden]{display:none}
.g{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:conic-gradient(#EA4335 0 25%,#FBBC05 0 50%,#34A853 0 75%,#4285F4 0)}
#msg.bad{color:var(--bad)}
.small{font-size:14px}
a{color:var(--acc)}
</style>
</head>
<body>
<main>
<svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modo Seca"><rect width="100" height="100" rx="22" fill="#142019"/><polyline points="22.5,32.8 38.0,43.1 50.0,39.7 63.8,56.9 75.8,67.2" fill="none" stroke="#EEF2EF" stroke-width="7.3" stroke-linecap="round" stroke-linejoin="round"/><line x1="22.5" y1="75.8" x2="77.5" y2="75.8" stroke="rgba(238,242,239,.35)" stroke-width="1.8"/><circle cx="75.8" cy="67.2" r="6.5" fill="#5B7CFF"/></svg>
<h1>Entrar no Modo Seca</h1>
<p id="msg">Toque no botão e escolha a sua conta Google.</p>
<button id="g" class="btn" type="button"><span class="g" aria-hidden="true">G</span> Entrar com Google</button>
<a id="back" class="btn primary" hidden href="#">Voltar para o Modo Seca</a>
<a id="cancel" class="btn" href="#">Cancelar e voltar</a>
<p class="small">Esta página só faz o login com Google do app Modo Seca e não guarda nada neste navegador. <a href="../privacidade/">Política de Privacidade</a></p>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';

const $ = id => document.getElementById(id);
const msg = (t, bad) => { $('msg').textContent = t; $('msg').className = bad ? 'bad' : ''; };
const PKG = 'com.luizigerski.modoseca';

let s = new URLSearchParams(location.search).get('s') || '';
if (/^[0-9a-f]{32}$/.test(s)) sessionStorage.setItem('ms-s', s); else s = sessionStorage.getItem('ms-s') || '';
const valid = /^[0-9a-f]{32}$/.test(s);

function backTo(params) {
  const q = new URLSearchParams(Object.assign({ s }, params)).toString();
  const intentUrl = 'intent://login?' + q + '#Intent;scheme=modoseca;package=' + PKG + ';end';
  $('back').href = intentUrl;
  $('back').hidden = false; $('g').hidden = true; $('cancel').hidden = true;
  sessionStorage.removeItem('ms-s');
  try { location.href = intentUrl; } catch (e) { /* o botão continua na tela */ }
}
$('cancel').href = valid ? 'intent://login?' + new URLSearchParams({ s, e: 'cancel' }).toString() + '#Intent;scheme=modoseca;package=' + PKG + ';end' : '../';

if (!valid) {
  msg('Abra esta página pelo app Modo Seca, no botão "Entrar com Google".', true);
  $('g').hidden = true;
} else {
  const app = initializeApp({
    apiKey: 'AIzaSyBdJ8EHFTwa318OTUG6faNd8-rTk54AdHU',
    authDomain: 'modo-seca.firebaseapp.com',
    projectId: 'modo-seca',
    appId: '1:954228921254:web:04adab9261ec454935f567'
  });
  const auth = getAuth(app);
  auth.languageCode = 'pt-BR';
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  async function done(result) {
    const cred = GoogleAuthProvider.credentialFromResult(result);
    if (!cred || !cred.idToken) throw Object.assign(new Error('sem token'), { code: 'no-token' });
    msg('Pronto! Toque em "Voltar para o Modo Seca".');
    backTo({ t: cred.idToken });
    signOut(auth).catch(() => {}); // não deixa a sessão aberta neste navegador
  }
  function fail(e) {
    const c = (e && e.code) || '';
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request' || c === 'auth/user-cancelled') msg('Login cancelado. Toque no botão para tentar de novo.');
    else if (c === 'auth/network-request-failed') msg('Sem internet. Conecte e tente de novo.', true);
    else msg('Não deu certo (' + (c || 'erro') + '). Tente de novo.', true);
  }
  getRedirectResult(auth).then(r => { if (r) return done(r); }).catch(fail);
  $('g').addEventListener('click', async () => {
    msg('Abrindo o Google…');
    try { await done(await signInWithPopup(auth, provider)); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
        try { await signInWithRedirect(auth, provider); } catch (e2) { fail(e2); }
      } else fail(e);
    }
  });
}
</script>
</body>
</html>
